services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    ports:
      - "8765:8765"

  cli-client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    depends_on:
      - server
    stdin_open: true
    tty: true
    command: ["--url", "http://server:8765", "--player", "1", "--agent", "human"]

  ai-client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    depends_on:
      - server
    command: ["--url", "http://server:8765", "--player", "2", "--agent", "bfs"]
